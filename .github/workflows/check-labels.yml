name: Check labels

on:
  pull_request:
    types: [labeled, unlabeled, synchronize]

jobs:
  check-labels:
    permissions:
      pull-requests: read
    uses: alextheman231/github-actions/.github/workflows/check-labels.yml@d1c2bd1832fa5ae4489ed8f9349676045a683655 # v12.8.0
    with:
      pull-request-number: ${{ github.event.pull_request.number }}
      APP_ID: ${{ vars.ALEX_UP_BOT_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
