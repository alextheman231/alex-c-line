name: Check labels

on:
  pull_request:
    types: [labeled, unlabeled, synchronize]

jobs:
  check-labels:
    permissions:
      pull-requests: read
    uses: alextheman231/github-actions/.github/workflows/check-labels.yml@64cb9a86fd3f029229d33d731a5f25ba70d24ba2 # v12.10.0
    with:
      pull-request-number: ${{ github.event.pull_request.number }}
      APP_ID: ${{ vars.ALEX_UP_BOT_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
