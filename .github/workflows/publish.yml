name: Publish the package

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-npm-version:
    permissions:
      contents: read
    uses: alextheman231/github-actions/.github/workflows/report-npm-version-existence.yml@0b57250b2e91ab1fff3a5b65deae7ea25a19b824 # v14.9.1
    with:
      node-version: 26

  check-version-tag:
    permissions:
      contents: read
    uses: alextheman231/github-actions/.github/workflows/report-version-tag-existence.yml@0b57250b2e91ab1fff3a5b65deae7ea25a19b824 # v14.9.1
    with:
      CLIENT_ID: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
      node-version: 26
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}

  check-release-note:
    permissions:
      contents: read
    uses: alextheman231/github-actions/.github/workflows/report-release-note-existence.yml@0b57250b2e91ab1fff3a5b65deae7ea25a19b824 # v14.9.1
    with:
      CLIENT_ID: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
      node-version: 26
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}

  npm-registry-publish:
    needs: [check-npm-version, check-version-tag, check-release-note]
    if: ${{ needs.check-npm-version.outputs.version-exists == 'false' && needs.check-version-tag.outputs.tag-exists == 'false' && needs.check-release-note.outputs.release-note-found == 'true' }}
    permissions:
      id-token: write
    uses: alextheman231/github-actions/.github/workflows/npm-registry-publish.yml@0b57250b2e91ab1fff3a5b65deae7ea25a19b824 # v14.9.1
    with:
      node-version: 26

  create-github-release:
    needs: [check-version-tag, check-release-note]
    permissions:
      contents: write
    if: ${{ needs.check-version-tag.outputs.tag-exists == 'false' && needs.check-release-note.outputs.release-note-found == 'true' }}
    uses: alextheman231/github-actions/.github/workflows/create-github-release.yml@0b57250b2e91ab1fff3a5b65deae7ea25a19b824 # v14.9.1
    with:
      CLIENT_ID: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
      tag: ${{ needs.check-version-tag.outputs.tag }}
      release-note-path: ${{ needs.check-release-note.outputs.release-note-path }}
      node-version: 26
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
