name: Publish the package

on:
  push:
    branches:
      - main

jobs:
  check-npm-version:
    permissions:
      contents: read
    uses: alextheman231/github-actions/.github/workflows/report-npm-version-existence.yml@6303ccc55913d70a641b50c97dc36475c5053c99 # v14.4.0
    with:
      node-version: 26

  check-version-tag:
    permissions:
      contents: read
    uses: alextheman231/github-actions/.github/workflows/report-version-tag-existence.yml@6303ccc55913d70a641b50c97dc36475c5053c99 # v14.4.0
    with:
      CLIENT_ID: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
      node-version: 26
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}

  npm-registry-publish:
    needs: [check-npm-version, check-version-tag]
    if: ${{ needs.check-npm-version.outputs.version-exists == 'false' && needs.check-version-tag.outputs.tag-exists == 'false' }}
    permissions:
      id-token: write
    uses: alextheman231/github-actions/.github/workflows/npm-registry-publish.yml@6303ccc55913d70a641b50c97dc36475c5053c99 # v14.4.0
    with:
      node-version: 26

  create-github-release:
    needs: [check-version-tag]
    permissions:
      contents: write
    if: ${{ needs.check-version-tag.outputs.tag-exists == 'false' }}
    uses: alextheman231/github-actions/.github/workflows/create-github-release.yml@6303ccc55913d70a641b50c97dc36475c5053c99 # v14.4.0
    with:
      CLIENT_ID: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
      tag: ${{ needs.check-version-tag.outputs.tag }}
      release-note-path: ${{ needs.check-release-note.outputs.release-note-path }}
      node-version: 26
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
