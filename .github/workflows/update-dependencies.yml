name: Update Dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: 0 9 * * 1

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    if: ${{ github.repository == 'alextheman231/alex-c-line' }}
    uses: alextheman231/github-actions/.github/workflows/update-dependencies.yml@0b57250b2e91ab1fff3a5b65deae7ea25a19b824 # v14.9.1
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
    with:
      CLIENT_ID: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
      update_pnpm: true
      update_javascript_dependencies: true
      update_actions: true
      update_python_dependencies: true
      node-version: 26
