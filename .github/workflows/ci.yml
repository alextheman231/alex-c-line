name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  package-ci-legacy:
    uses: alextheman231/github-actions/.github/workflows/package-ci.yml@6303ccc55913d70a641b50c97dc36475c5053c99 # v14.4.0
    with:
      node-version: 22

  package-ci:
    uses: alextheman231/github-actions/.github/workflows/package-ci.yml@6303ccc55913d70a641b50c97dc36475c5053c99 # v14.4.0
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      node-version: 26

  actions-ci:
    permissions:
      contents: read
    uses: alextheman231/github-actions/.github/workflows/actions-ci.yml@bc8e87ed726b1680a46574b7de40ff2f3c364894 # v14.8.0
    with:
      CLIENT_ID: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}

  pyproject-ci:
    permissions:
      contents: read
    uses: alextheman231/github-actions/.github/workflows/pyproject-ci.yml@bc8e87ed726b1680a46574b7de40ff2f3c364894 # v14.8.0

  end-to-end-legacy:
    uses: alextheman231/github-actions/.github/workflows/end-to-end-node-package-ci.yml@6303ccc55913d70a641b50c97dc36475c5053c99 # v14.4.0
    with:
      node-version: 22

  end-to-end-ci:
    uses: alextheman231/github-actions/.github/workflows/end-to-end-node-package-ci.yml@6303ccc55913d70a641b50c97dc36475c5053c99 # v14.4.0
    with:
      node-version: 26

  secret-scan-ci:
    permissions:
      contents: read
    uses: alextheman231/github-actions/.github/workflows/secret-scan-ci.yml@6303ccc55913d70a641b50c97dc36475c5053c99 # v14.4.0
    with:
      github-push-before-sha: ${{ github.event.before }}
      github-push-base-sha: ${{ github.event.base_ref }}
      github-pull-base-sha: ${{ github.event.pull_request.base.sha }}
    secrets:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
