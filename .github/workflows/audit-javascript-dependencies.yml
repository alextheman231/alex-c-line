name: Audit dependencies

on:
  pull_request:
    branches: ["main"]
    paths:
      - "**/pnpm-lock.yaml"

jobs:
  audit-javascript-dependencies:
    permissions:
      contents: read
      pull-requests: write
    uses: alextheman231/github-actions/.github/workflows/audit-javascript-dependencies.yml@418c332315197ab9833fa7e2abf2bfb6475335d1 # v14.3.0
    with:
      pull-request-number: ${{ github.event.pull_request.number }}
      CLIENT_ID: ${{ vars.ALEX_UP_BOT_CLIENT_ID }}
      node-version: 26
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
